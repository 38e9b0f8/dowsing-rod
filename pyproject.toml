[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "dowsing-rod"
version = "0.2.0"
description = "Structural refactoring intelligence for source code — Rust-native, AI-ready"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
keywords = ["refactoring", "static-analysis", "ai", "code-quality", "javascript", "typescript", "c", "cpp", "csharp", "verilog", "vhdl"]

[project.scripts]
dowsing-rod = "dowsing_rod:_cli_main"

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
python-source = "python"
module-name = "dowsing_rod._native"
manifest-path = "crates/dowsing-python/Cargo.toml"
include = ["THIRD_PARTY_NOTICES.md"]

[tool.dowsing-rod]
# Default configuration
min_similarity = 0.75
normalization = "balanced"
# exclude = ["generated/", "vendor/"]
