# cargo-deny policy for the Rust dependency tree (run by .github/workflows/security.yml).
# Local check: cargo deny --all-features check

[graph]
all-features = true

[advisories]
# RustSec database: fail on any vulnerability or yanked crate anywhere in the tree, and on
# unmaintained crates we depend on directly (transitive ones, such as rustpython-parser's
# unic-* and paste, have no maintained replacement upstream). Every `ignore` needs a reason.
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # pyo3 is only linked into the Python extension (crates/dowsing-python), never into the
  # dowsing-rod binary shipped by Maven, npm, and NuGet. The PyPI release is disabled.
  # TODO(pypi): upgrade pyo3 (>= 0.24.1) and remove both entries before enabling PyPI publishing.
  { id = "RUSTSEC-2025-0020", reason = "pyo3: Python extension only; PyPI publishing disabled until pyo3 is upgraded" },
  { id = "RUSTSEC-2026-0177", reason = "pyo3: Python extension only; PyPI publishing disabled until pyo3 is upgraded" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses that are compatible with shipping a statically linked MIT binary.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
]

# malachite (big integers for rustpython-parser's Python literals) is LGPL-3.0-only and is
# statically linked into every shipped binary. Allowed here only by name so no other copyleft
# crate can slip in. TODO(release): resolve before the first public release, see TODO.md.
[[licenses.exceptions]]
crate = "malachite"
allow = ["LGPL-3.0-only"]
[[licenses.exceptions]]
crate = "malachite-base"
allow = ["LGPL-3.0-only"]
[[licenses.exceptions]]
crate = "malachite-bigint"
allow = ["LGPL-3.0-only"]
[[licenses.exceptions]]
crate = "malachite-nz"
allow = ["LGPL-3.0-only"]
[[licenses.exceptions]]
crate = "malachite-q"
allow = ["LGPL-3.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
