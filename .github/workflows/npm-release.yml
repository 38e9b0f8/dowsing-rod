name: npm release review

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed artifacts (requires a matching version tag and npm-release environment approval)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-native.yml
    with:
      package: npm

  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          node: true
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs --check-tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: dist/tarballs
          merge-multiple: true
      - name: Publish binaries, then launcher (npm trusted publishing)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test "$(find dist/tarballs -name '*.tgz' | wc -l)" -eq 6
          for package in dist/tarballs/dowsing-rod-native-*.tgz; do
            npm publish "$package" --access public --provenance
          done
          npm publish dist/tarballs/dowsing-rod-*.tgz --access public --provenance
