name: npm release review

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed artifacts (requires a matching version tag and npm-release environment approval)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, platform: darwin-arm64, target: aarch64-apple-darwin, suffix: '' }
          - { runner: macos-15-intel, platform: darwin-x64, target: x86_64-apple-darwin, suffix: '' }
          - { runner: ubuntu-22.04, platform: linux-x64, target: x86_64-unknown-linux-gnu, suffix: '' }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, target: aarch64-unknown-linux-gnu, suffix: '' }
          - { runner: windows-2022, platform: win32-x64, target: x86_64-pc-windows-msvc, suffix: '.exe' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p dowsing-core -p dowsing-cli --all-targets --locked -- -D warnings
      - run: cargo test -p dowsing-core -p dowsing-cli --all-targets --locked
      - run: cargo build -p dowsing-cli --release --locked --target ${{ matrix.target }}
      - name: Stage native package and launcher
        run: |
          node scripts/package-npm.mjs ${{ matrix.platform }} target/${{ matrix.target }}/release/dowsing-rod${{ matrix.suffix }}
          node scripts/package-npm.mjs launcher -
      - name: Test packed npm installation and CLI
        run: node scripts/test-npm.mjs
      - name: Pack native artifact
        shell: bash
        run: |
          mkdir -p dist/tarballs
          npm pack ./dist/npm/dowsing-rod-native-${{ matrix.platform }} --pack-destination dist/tarballs --ignore-scripts
      - name: Pack launcher once
        if: matrix.platform == 'linux-x64'
        run: npm pack ./dist/npm/dowsing-rod --pack-destination dist/tarballs --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: dist/tarballs/*.tgz
          if-no-files-found: error

  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const v=require("./npm/dowsing-rod/package.json").version; if(process.env.RELEASE_TAG !== `v${v}`) process.exit(1)'
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: dist/tarballs
          merge-multiple: true
      - name: Publish binaries, then launcher (npm trusted publishing)
        shell: bash
        run: |
          test "$(find dist/tarballs -name '*.tgz' | wc -l)" -eq 6
          for package in dist/tarballs/dowsing-rod-native-*.tgz; do
            npm publish "$package" --access public --provenance
          done
          npm publish dist/tarballs/dowsing-rod-*.tgz --access public --provenance
