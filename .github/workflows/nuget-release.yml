name: NuGet release review

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed package (requires a matching version tag and nuget-release environment approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    uses: ./.github/workflows/build-native.yml
    with:
      package: nuget

  package:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          dotnet: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuget-native-*
          path: nuget/dowsing-rod/native
          merge-multiple: true
      - name: Check staged native binaries
        run: |
          test -f nuget/dowsing-rod/native/osx-arm64/dowsing-rod
          test -f nuget/dowsing-rod/native/osx-x64/dowsing-rod
          test -f nuget/dowsing-rod/native/linux-arm64/dowsing-rod
          test -f nuget/dowsing-rod/native/linux-x64/dowsing-rod
          test -f nuget/dowsing-rod/native/linux-musl-arm64/dowsing-rod
          test -f nuget/dowsing-rod/native/linux-musl-x64/dowsing-rod
          test -f nuget/dowsing-rod/native/win-x64/dowsing-rod.exe
      - run: dotnet pack nuget/dowsing-rod --configuration Release --output dist/nuget
      - name: Test installed tool
        run: |
          mkdir "$RUNNER_TEMP/dowsing-rod-tool"
          VERSION="$(node scripts/version.mjs)"
          dotnet tool install --tool-path "$RUNNER_TEMP/dowsing-rod-tool" --add-source "$GITHUB_WORKSPACE/dist/nuget" dowsing-rod --version "$VERSION"
          "$RUNNER_TEMP/dowsing-rod-tool/dowsing-rod" version
          "$RUNNER_TEMP/dowsing-rod-tool/dowsing-rod" scan tests/languages --format json --no-cache --fail-on-error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: dist/nuget/*.nupkg
          if-no-files-found: error

  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          dotnet: true
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/version.mjs --check-tag "$RELEASE_TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: dist/nuget
      - name: Authenticate to NuGet with OIDC
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push dist/nuget/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
