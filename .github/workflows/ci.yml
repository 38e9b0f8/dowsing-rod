name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  legacy-linux:
    name: Linux glibc 2.17 compatibility
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/toolchain
        with:
          zig: true
      - name: Build against glibc 2.17
        run: cargo zigbuild -p dowsing-cli --release --locked --target x86_64-unknown-linux-gnu.2.17
      - name: Check symbols and run on the manylinux2014 baseline
        run: |
          REQUIRED="$(readelf --version-info target/x86_64-unknown-linux-gnu/release/dowsing-rod | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1)"
          test "$REQUIRED" = "GLIBC_2.17"
          docker run --rm -v "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/release/dowsing-rod:/dowsing-rod:ro" quay.io/pypa/manylinux2014_x86_64 /dowsing-rod version

  test:
    name: Rust and Python
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Smoke test CLI and Python API
        run: |
          dowsing-rod version
          dowsing-rod scan tests/fixtures --format json --no-cache
          dowsing-rod scan tests/fixtures --ai --max-tokens 1200 --no-cache
          python -c "import dowsing_rod; print(dowsing_rod.__version__)"

      - name: Smoke test init and auto
        run: |
          # This repository's pyproject.toml configures dowsing-rod, so auto works from a subfolder.
          dowsing-rod auto tests/fixtures
          # A folder with no configuration anywhere above it: auto refuses, then works after init.
          PROJECT="$RUNNER_TEMP/init-check"
          mkdir "$PROJECT"
          cp tests/fixtures/exact_duplicates.py "$PROJECT/"
          if dowsing-rod auto "$PROJECT"; then echo "auto should fail without configuration"; exit 1; fi
          dowsing-rod init "$PROJECT"
          if dowsing-rod init "$PROJECT"; then echo "init should refuse to overwrite"; exit 1; fi
          dowsing-rod auto "$PROJECT"
          test -f "$PROJECT/.dowsing-rod-cache/.gitignore"

      - name: Set up Node
        uses: ./.github/actions/toolchain
        with:
          node: true

      - name: Test npm packed install
        run: |
          cargo build -p dowsing-cli --release --locked
          node scripts/package-npm.mjs linux-x64 target/release/dowsing-rod
          node scripts/package-npm.mjs launcher -
          node scripts/test-npm.mjs

      - name: Set up .NET
        uses: ./.github/actions/toolchain
        with:
          dotnet: true

      - name: Test packed NuGet tool
        run: |
          node scripts/package-nuget.mjs linux-x64 target/release/dowsing-rod nuget/dowsing-rod/native
          dotnet pack nuget/dowsing-rod --configuration Release --output dist/nuget
          mkdir "$RUNNER_TEMP/dowsing-rod-tool"
          VERSION="$(node scripts/version.mjs)"
          dotnet tool install --tool-path "$RUNNER_TEMP/dowsing-rod-tool" --add-source "$GITHUB_WORKSPACE/dist/nuget" dowsing-rod --version "$VERSION"
          "$RUNNER_TEMP/dowsing-rod-tool/dowsing-rod" version
          "$RUNNER_TEMP/dowsing-rod-tool/dowsing-rod" scan tests/languages --format json --no-cache --fail-on-error
