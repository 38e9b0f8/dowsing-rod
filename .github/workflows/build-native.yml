name: Build native binaries

# Shared by the npm and NuGet release workflows, so the platform list, the
# compatibility floors (glibc 2.17, macOS 11.0 and 10.12), and the build-and-test
# steps are set once.
on:
  workflow_call:
    inputs:
      package:
        description: Which package to stage from the binaries, "npm" or "nuget".
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # platform is the npm package suffix; rid is the .NET runtime identifier.
        include:
          - { runner: macos-14, platform: darwin-arm64, rid: osx-arm64, rust_target: aarch64-apple-darwin, artifact_target: aarch64-apple-darwin, builder: cargo, macos: true, macos_deployment_target: '11.0', suffix: '' }
          - { runner: macos-15-intel, platform: darwin-x64, rid: osx-x64, rust_target: x86_64-apple-darwin, artifact_target: x86_64-apple-darwin, builder: cargo, macos: true, macos_deployment_target: '10.12', suffix: '' }
          - { runner: ubuntu-22.04, platform: linux-x64, rid: linux-x64, rust_target: x86_64-unknown-linux-gnu, artifact_target: x86_64-unknown-linux-gnu, zig_target: x86_64-unknown-linux-gnu.2.17, builder: zig, suffix: '' }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, rid: linux-arm64, rust_target: aarch64-unknown-linux-gnu, artifact_target: aarch64-unknown-linux-gnu, zig_target: aarch64-unknown-linux-gnu.2.17, builder: zig, suffix: '' }
          - { runner: windows-2022, platform: win32-x64, rid: win-x64, rust_target: x86_64-pc-windows-msvc, artifact_target: x86_64-pc-windows-msvc, builder: cargo, static_crt: true, suffix: '.exe' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/toolchain
        with:
          node: true
          zig: ${{ matrix.builder == 'zig' }}
      - name: Set macOS deployment target
        if: matrix.macos
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"
      - name: Statically link the Windows C runtime
        if: matrix.static_crt
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy -p dowsing-core -p dowsing-cli --all-targets --locked -- -D warnings
      - run: cargo test -p dowsing-core -p dowsing-cli --all-targets --locked
      - run: cargo build -p dowsing-cli --release --locked --target ${{ matrix.rust_target }}
        if: matrix.builder == 'cargo'
      - run: cargo zigbuild -p dowsing-cli --release --locked --target ${{ matrix.zig_target }}
        if: matrix.builder == 'zig'
      - name: Verify Linux glibc floor
        if: matrix.builder == 'zig'
        run: |
          REQUIRED="$(readelf --version-info target/${{ matrix.artifact_target }}/release/dowsing-rod | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1)"
          test "$REQUIRED" = "GLIBC_2.17"

      # npm: stage, test the packed install on this platform, and pack.
      - name: Stage native package and launcher
        if: inputs.package == 'npm'
        run: |
          node scripts/package-npm.mjs ${{ matrix.platform }} target/${{ matrix.artifact_target }}/release/dowsing-rod${{ matrix.suffix }}
          node scripts/package-npm.mjs launcher -
      - name: Test packed npm installation and CLI
        if: inputs.package == 'npm'
        run: node scripts/test-npm.mjs
      - name: Pack native artifact
        if: inputs.package == 'npm'
        shell: bash
        run: |
          mkdir -p dist/tarballs
          npm pack ./dist/npm/dowsing-rod-native-${{ matrix.platform }} --pack-destination dist/tarballs --ignore-scripts
      - name: Pack launcher once
        if: inputs.package == 'npm' && matrix.platform == 'linux-x64'
        run: npm pack ./dist/npm/dowsing-rod --pack-destination dist/tarballs --ignore-scripts
      - if: inputs.package == 'npm'
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: dist/tarballs/*.tgz
          if-no-files-found: error

      # NuGet: stage the binary for the dotnet tool package.
      - name: Stage native binary for NuGet
        if: inputs.package == 'nuget'
        run: node scripts/package-nuget.mjs ${{ matrix.rid }} target/${{ matrix.artifact_target }}/release/dowsing-rod${{ matrix.suffix }}
      - if: inputs.package == 'nuget'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-native-${{ matrix.rid }}
          path: dist/nuget-native/${{ matrix.rid }}
          if-no-files-found: error
