name: Build native binaries

# Shared by the npm, NuGet, and Maven release workflows, so the platform list, the
# compatibility floors (glibc 2.17, static musl, macOS 11.0 and 10.12), and the
# build-and-test steps are set once. Release builds use no caches (cache-poisoning guard).
on:
  workflow_call:
    inputs:
      package:
        description: Which package to stage from the binaries, "npm", "nuget", or "maven".
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # platform is the npm package suffix; rid is the .NET runtime identifier;
        # maven is the dowsing-rod-native classifier (os-maven-plugin naming).
        include:
          - { runner: macos-15, platform: darwin-arm64, rid: osx-arm64, maven: osx-aarch_64, rust_target: aarch64-apple-darwin, artifact_target: aarch64-apple-darwin, builder: cargo, macos: true, macos_deployment_target: '11.0', suffix: '' }
          - { runner: macos-15-intel, platform: darwin-x64, rid: osx-x64, maven: osx-x86_64, rust_target: x86_64-apple-darwin, artifact_target: x86_64-apple-darwin, builder: cargo, macos: true, macos_deployment_target: '10.12', suffix: '' }
          - { runner: ubuntu-22.04, platform: linux-x64, rid: linux-x64, maven: linux-x86_64, rust_target: x86_64-unknown-linux-gnu, artifact_target: x86_64-unknown-linux-gnu, zig_target: x86_64-unknown-linux-gnu.2.17, builder: zig, suffix: '' }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, rid: linux-arm64, maven: linux-aarch_64, rust_target: aarch64-unknown-linux-gnu, artifact_target: aarch64-unknown-linux-gnu, zig_target: aarch64-unknown-linux-gnu.2.17, builder: zig, suffix: '' }
          - { runner: ubuntu-22.04, platform: linux-x64-musl, rid: linux-musl-x64, maven: linux-x86_64-musl, rust_target: x86_64-unknown-linux-musl, artifact_target: x86_64-unknown-linux-musl, zig_target: x86_64-unknown-linux-musl, builder: zig, musl: true, suffix: '' }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64-musl, rid: linux-musl-arm64, maven: linux-aarch_64-musl, rust_target: aarch64-unknown-linux-musl, artifact_target: aarch64-unknown-linux-musl, zig_target: aarch64-unknown-linux-musl, builder: zig, musl: true, suffix: '' }
          - { runner: windows-2022, platform: win32-x64, rid: win-x64, maven: windows-x86_64, rust_target: x86_64-pc-windows-msvc, artifact_target: x86_64-pc-windows-msvc, builder: cargo, static_crt: true, suffix: '.exe' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
          components: rustfmt, clippy
      - uses: ./.github/actions/toolchain
        with:
          node: true
          zig: ${{ matrix.builder == 'zig' }}
      - name: Set macOS deployment target
        if: matrix.macos
        env:
          DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: echo "MACOSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
      - name: Statically link the Windows C runtime
        if: matrix.static_crt
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy -p dowsing-core -p dowsing-cli --all-targets --locked -- -D warnings
      - run: cargo test -p dowsing-core -p dowsing-cli --all-targets --locked
      - run: cargo build -p dowsing-cli --release --locked --target ${{ matrix.rust_target }}
        if: matrix.builder == 'cargo'
      - run: cargo zigbuild -p dowsing-cli --release --locked --target ${{ matrix.zig_target }}
        if: matrix.builder == 'zig'
      - name: Verify Linux glibc floor
        if: matrix.builder == 'zig' && !matrix.musl
        run: |
          REQUIRED="$(readelf --version-info target/${{ matrix.artifact_target }}/release/dowsing-rod | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1)"
          test "$REQUIRED" = "GLIBC_2.17"
      - name: Verify static musl binary on Alpine
        if: matrix.musl
        run: |
          BINARY="target/${{ matrix.artifact_target }}/release/dowsing-rod"
          test -z "$(readelf --program-headers "$BINARY" | grep INTERP || true)"
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -w /work alpine:3.20 "$BINARY" scan tests/languages --format json --no-cache --fail-on-error > /dev/null

      # npm: stage, test the packed install on this platform, and pack.
      - name: Stage native package and launcher
        if: inputs.package == 'npm'
        run: |
          node scripts/package-npm.mjs ${{ matrix.platform }} target/${{ matrix.artifact_target }}/release/dowsing-rod${{ matrix.suffix }}
          node scripts/package-npm.mjs launcher -
      - name: Test packed npm installation and CLI
        if: inputs.package == 'npm' && !matrix.musl
        run: node scripts/test-npm.mjs
      - name: Test packed npm installation and CLI on Alpine
        if: inputs.package == 'npm' && matrix.musl
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work node:24-alpine node scripts/test-npm.mjs
      - name: Pack native artifact
        if: inputs.package == 'npm'
        shell: bash
        run: |
          mkdir -p dist/tarballs
          npm pack ./dist/npm/dowsing-rod-native-${{ matrix.platform }} --pack-destination dist/tarballs --ignore-scripts
      - name: Pack launcher once
        if: inputs.package == 'npm' && matrix.platform == 'linux-x64'
        run: npm pack ./dist/npm/dowsing-rod --pack-destination dist/tarballs --ignore-scripts
      - if: inputs.package == 'npm'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.platform }}
          path: dist/tarballs/*.tgz
          if-no-files-found: error

      # NuGet: stage the binary for the dotnet tool package.
      - name: Stage native binary for NuGet
        if: inputs.package == 'nuget'
        run: node scripts/package-nuget.mjs ${{ matrix.rid }} target/${{ matrix.artifact_target }}/release/dowsing-rod${{ matrix.suffix }}
      # Upload the parent folder: upload-artifact drops the top folder of a single
      # path, and the package job needs each binary under its <rid>/ folder.
      - if: inputs.package == 'nuget'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-native-${{ matrix.rid }}
          path: dist/nuget-native
          if-no-files-found: error

      # Maven: stage the binary (and its checksum) for the dowsing-rod-native classifier jar.
      - name: Stage native binary for Maven
        if: inputs.package == 'maven'
        run: node scripts/package-maven.mjs ${{ matrix.maven }} target/${{ matrix.artifact_target }}/release/dowsing-rod${{ matrix.suffix }} dist/maven-native
      - if: inputs.package == 'maven'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-native-${{ matrix.maven }}
          path: dist/maven-native
          if-no-files-found: error
